name: Build and Deploy Web and APK

# Same flow as the IMCI app. Every push to main:
#   1. builds the Android APK (signed with the release key from secrets),
#   2. publishes the APK as a GitHub Release (permanent public link):
#        https://github.com/Gussaay/eaay-pedia-app/releases/latest/download/easy-pedia-mcqs.apk
#   3. builds the web app and deploys it to Firebase Hosting with
#      native-version.json (read by the app to offer updates). The short link
#        https://easy-pedia.web.app/download/easy-pedia-mcqs.apk
#      redirects to the GitHub Release (firebase.json "redirects"), because
#      Firebase Hosting refuses .apk files on the free Spark plan.
#      Download page: https://easy-pedia.web.app/download
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Stops an older run when you push twice quickly, so two deploys never race.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  SITE_URL: https://easy-pedia.web.app
  APK_NAME: easy-pedia-mcqs.apk
  # Oldest installed app that may receive an over-the-air bundle.
  #
  # An OTA update only replaces HTML/CSS/JS. If the new web code calls a
  # Capacitor plugin that the installed APK does not contain, the app crashes
  # on launch and the user cannot recover without reinstalling — so bundles are
  # withheld from APKs older than this.
  #
  # BUMP THIS to the versionCode of the current build whenever you add or
  # remove a Capacitor plugin (anything in package.json under @capacitor/ or
  # @capgo/). 21 is the build that introduced push notifications, the Capgo
  # updater and the file opener.
  MIN_NATIVE_BUILD: 21

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      # Version = <major>.<minor> from package.json + GitHub run number, e.g. 6.0.12.
      # versionCode stays above the old Sketchware app (9).
      - name: Set app version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${{ github.run_number }}"
          CODE=$(( ${{ github.run_number }} + 10 ))
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE)"

      - name: Install dependencies
        run: npm ci

      # Optional: lets the real console file be kept out of the repository.
      # Without either this secret or the committed file, the google-services
      # Gradle plugin is skipped and push notifications quietly never work.
      # `secrets` cannot be used in a step-level `if`, so presence is decided in
      # the job env (same pattern as HAS_KEYSTORE above) and the value is
      # passed through the environment rather than pasted into the shell.
      - name: Use google-services.json from secrets (if provided)
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "Wrote google-services.json from the repository secret."

      - name: Build web assets and sync Android
        run: |
          npm run build
          npx cap sync android

      # A plugin that is installed in npm but missing from the Android project
      # builds and runs fine right up until the feature is used. Failing here
      # is how the IMCI app stopped shipping APKs with dead push support.
      - name: Check the native plugins really synced
        run: |
          test -s android/app/google-services.json \
            || { echo "::error::android/app/google-services.json is missing - push notifications will not work"; exit 1; }
          for plugin in capacitor-push-notifications capgo-capacitor-updater capacitor-community-file-opener; do
            grep -qi "$plugin" android/capacitor.settings.gradle \
              || { echo "::error::$plugin is missing from the Android project"; exit 1; }
          done
          echo "All native plugins are present."

      - name: Set versionCode / versionName
        run: |
          sed -i -e "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -e "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Release APK signed with the key from secrets (see keystore-secrets.txt on
      # the developer PC). A stable key is required so users can install updates.
      # The original app's key (easypediamcqs.jks) is a Sketchware/BouncyCastle
      # UBER keystore; scripts/prepare-keystore.sh converts any format to PKCS12.
      # KEY_ALIAS is optional (auto-detected when the keystore has one key).
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/src.keystore"
          export SRC_KEYSTORE="$RUNNER_TEMP/src.keystore" OUT_P12="$RUNNER_TEMP/release.p12"
          SIGN_ALIAS=$(bash scripts/prepare-keystore.sh | tee /dev/stderr | sed -n 's/^SIGN_ALIAS=//p')
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          BT=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)
          $BT/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
          $BT/apksigner sign --ks "$OUT_P12" --ks-type PKCS12 \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "../$APK_NAME" \
            app/build/outputs/apk/release/app-release-aligned.apk
          $BT/apksigner verify --print-certs "../$APK_NAME" | head -3
          rm -f "$RUNNER_TEMP/src.keystore" "$OUT_P12"

      # Fallback until the keystore secrets are added. Debug keys change on every
      # CI run, so users would have to uninstall before updating.
      - name: Build debug APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::KEYSTORE_BASE64 secret not set - publishing a DEBUG-signed APK."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../$APK_NAME"

      # Read by the installed app to offer updates (like IMCI's native-version.json).
      - name: Create native-version.json
        run: |
          SIZE=$(du -h "$APK_NAME" | cut -f1)
          NOTES=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          cat > native-version.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "version": "${{ steps.version.outputs.version }}",
            "apkUrl": "${SITE_URL}/download/${APK_NAME}",
            "size": "${SIZE}",
            "signed": ${HAS_KEYSTORE},
            "notes": "${NOTES}",
            "date": "$(date -u +%Y-%m-%d)"
          }
          EOF
          cat native-version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ env.APK_NAME }}
            native-version.json
          retention-days: 30

  web:
    name: Build & deploy web (Firebase Hosting)
    # Waits for the release so the /download redirect target already exists.
    needs: [android, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set app version
        run: npm version "${{ needs.android.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      # The over-the-air bundle: the whole built site, zipped and served from
      # the site itself. Installed apps download this (a few hundred KB) and
      # swap their web layer, so only a change to the native shell needs a new
      # APK. Zipped before anything else is added to dist/, so the bundle never
      # contains itself.
      - name: Create the over-the-air bundle
        run: |
          VERSION="${{ needs.android.outputs.version }}"
          ZIP="update-${VERSION}.zip"
          (cd dist && zip -qr "../${ZIP}" .)
          # Capgo verifies this before installing. Without it a half-downloaded
          # zip is unpacked, the app fails to start, and the previous bundle is
          # restored - which looks to the user like the update undid itself.
          CHECKSUM=$(sha256sum "${ZIP}" | cut -d' ' -f1)
          mkdir -p dist/latest
          mv "${ZIP}" dist/latest/
          cat > dist/latest/update.json <<EOF
          {
            "version": "${VERSION}",
            "url": "${SITE_URL}/latest/${ZIP}",
            "checksum": "${CHECKSUM}",
            "minNativeBuild": ${MIN_NATIVE_BUILD},
            "mandatory": false,
            "notes": "$(git log -1 --pretty=%s | sed 's/"/\\"/g')"
          }
          EOF
          cat dist/latest/update.json
          echo "OTA_ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "OTA_CHECKSUM=${CHECKSUM}" >> "$GITHUB_ENV"

      - name: Download build info
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      # Only the version file: the APK itself is served from the GitHub Release.
      - name: Add version file to the site
        run: cp apk/native-version.json dist/native-version.json

      # Secret FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA was created by `firebase init hosting:github`.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
          channelId: live
          projectId: easy-pedia

      - name: Verify the download link is live
        run: |
          for i in 1 2 3 4 5; do
            LIVE=$(curl -fsSL "${SITE_URL}/native-version.json?t=$(date +%s)" || echo "")
            echo "$LIVE"
            if echo "$LIVE" | grep -q "\"${{ needs.android.outputs.version }}\""; then
              curl -sSI "${SITE_URL}/download/${APK_NAME}" | grep -iE "^(HTTP|location)"
              exit 0
            fi
            echo "Not live yet, waiting..."
            sleep 15
          done
          echo "::error::native-version.json did not show the new version."
          exit 1

      # Only once the files are provably live is the database told to point
      # apps at them. The other order hands out a link to a 404.
      - name: Verify the over-the-air bundle is live
        run: |
          for i in 1 2 3 4 5; do
            LIVE=$(curl -fsSL "${SITE_URL}/latest/update.json?t=$(date +%s)" || echo "")
            echo "$LIVE"
            if echo "$LIVE" | grep -q "\"${{ needs.android.outputs.version }}\""; then
              curl -fsSI "${SITE_URL}/latest/${OTA_ZIP}" | head -1
              exit 0
            fi
            echo "Not live yet, waiting..."
            sleep 15
          done
          echo "::error::update.json did not show the new version."
          exit 1

      # Commit message switches:
      #   [force-update]  the update installs instead of asking
      #   [hold]          publish the files but do not roll them out yet
      #   [no-notify]     skip the "new version" push notification
      - name: Record the release and roll it out
        # Bookkeeping, not the release itself. If the service account cannot
        # write the database, apps still update from /latest/update.json, so
        # this must not fail a deploy that has already gone live.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          EXTRA=""
          echo "$MSG" | grep -qi '\[force-update\]' && EXTRA="$EXTRA --mandatory"
          echo "$MSG" | grep -qi '\[hold\]' && EXTRA="$EXTRA --hold"
          node scripts/publish-release.mjs \
            --version "${{ needs.android.outputs.version }}" \
            --version-code "${{ needs.android.outputs.version_code }}" \
            --url "${SITE_URL}/latest/${OTA_ZIP}" \
            --checksum "${OTA_CHECKSUM}" \
            --min-native-build "${MIN_NATIVE_BUILD}" \
            --apk-url "${SITE_URL}/download/${APK_NAME}" \
            --notes "$MSG" \
            $EXTRA

      - name: Tell devices a new version is out
        if: ${{ !contains(github.event.head_commit.message, '[no-notify]') && !contains(github.event.head_commit.message, '[hold]') }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          node scripts/send-push.mjs --release \
            --version "${{ needs.android.outputs.version }}" \
            --notes "$(git log -1 --pretty=%s)"

      # Anything an admin queued in the Notification manager while this deploy
      # was running goes out now rather than waiting for the next schedule.
      - name: Send queued notifications
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: node scripts/send-push.mjs --outbox

  release:
    name: Publish GitHub Release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          name: Easy Pedia MCQs v${{ needs.android.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android APK for Easy Pedia MCQs v${{ needs.android.outputs.version }} (versionCode ${{ needs.android.outputs.version_code }}).

            Permanent download links (always the newest version):
            - ${{ env.SITE_URL }}/download
            - https://github.com/${{ github.repository }}/releases/latest/download/${{ env.APK_NAME }}

            Web app: ${{ env.SITE_URL }}
          files: |
            ${{ env.APK_NAME }}
            native-version.json
