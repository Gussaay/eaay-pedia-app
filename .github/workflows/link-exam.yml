name: Link exam questions

# For each new DOH (HAAD) quiz: without its links file, prints link candidates
# in the log; with it, writes the picked links. (The Jan + Feb 2024 paper was
# linked from data/exams/doh-haad-links.json in an earlier run.)
on:
  push:
    branches:
      - claude/project-thread-cop9he
    paths:
      - 'scripts/link-exam.mjs'
      - 'data/exams/doh-haad-pv-2024-03-links.json'
      - 'data/exams/doh-haad-pv-33-links.json'
      - '.github/workflows/link-exam.yml'
  workflow_dispatch:

concurrency:
  group: link-exam
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: Link
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # One quiz at a time: a links file applies the picks, no file prints candidates.
          link() {
            if [ -f "$2" ]; then
              node --max-old-space-size=6000 scripts/link-exam.mjs --book doh_haad --quiz "$1" --apply "$2" --commit
            else
              node --max-old-space-size=6000 scripts/link-exam.mjs --book doh_haad --quiz "$1"
            fi
          }
          link "Pearson VUE 5 Mar 2024" data/exams/doh-haad-pv-2024-03-links.json
          link "Pearson VUE recall 33" data/exams/doh-haad-pv-33-links.json
          rm -f "$RUNNER_TEMP/sa.json"
