name: Upload exam paper

# Writes the DOH (HAAD) papers in data/exams into the Realtime Database with
# scripts/upload-exam-json.mjs, using the same service account as the hosting
# deploy. Runs only from this branch; the script skips a paper that is already
# there, so a re-run cannot duplicate it. The undo manifest is kept as a run
# artifact (node scripts/upload-exam-json.mjs --undo <file> --commit). After the
# upload, scripts/arrange-exams.mjs sorts the book's quizzes by exam date.
on:
  push:
    branches:
      - claude/project-thread-cop9he
    paths:
      - 'data/exams/doh-haad-*.json'
      - 'scripts/arrange-exams.mjs'
      - '.github/workflows/upload-exam.yml'
  workflow_dispatch:

concurrency:
  group: upload-exam
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: Upload
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          for paper in doh-haad-2024-05 doh-haad-pv-2024-03-03a doh-haad-pv-2024-03-03c doh-haad-2024-01 \
            doh-haad-2023-06-08 doh-haad-2023-05-10 doh-haad-2023-03-27 doh-haad-2023-02-ad doh-haad-2023-01-30; do
            node scripts/upload-exam-json.mjs "data/exams/$paper.json" \
              --bank gulf_licensing --bank-title "Gulf Licensing Exams" \
              --book doh_haad --book-title "DOH (HAAD)" --commit
            if [ -f .tmp/exam-upload-keys-doh_haad.json ]; then mv .tmp/exam-upload-keys-doh_haad.json ".tmp/exam-upload-keys-$paper.json"; fi
          done
          node scripts/arrange-exams.mjs --book doh_haad --order data/exams/doh-haad-order.json --commit
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-upload-keys
          path: |
            .tmp/exam-upload-keys-*.json
            .tmp/arrange-doh_haad.json
          if-no-files-found: ignore
          include-hidden-files: true
