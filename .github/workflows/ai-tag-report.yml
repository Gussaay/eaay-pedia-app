name: AI tags report

# Prints the AI tags and links report (scripts/ai-tag.mjs --phase report)
# without waiting for the end of an ai-tag.yml round: progress, common
# topics, the check against the links checked by hand (DOH, Saudi
# Prometric), and samples. Reads only; writes nothing.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-cop9he
    paths:
      - '.github/workflows/ai-tag-report.yml'

concurrency:
  group: ai-tag-report
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: Report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node --max-old-space-size=6000 scripts/ai-tag.mjs --phase report --sample 80
          rm -f "$RUNNER_TEMP/sa.json"
