name: Daily question

# The morning "Question of the day" (scripts/daily-question.mjs): at 7 am in
# Sudan it posts one picked from the bank when nobody posted one today, and
# sends today's question to every phone. A push to the script only prints what
# it would do.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/daily-question.mjs'
      - 'src/lib/dailyPick.js'
      - '.github/workflows/daily-question.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: daily-question
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: Post and send today's question
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/daily-question.mjs
          else
            node scripts/daily-question.mjs --commit
          fi
          rm -f "$RUNNER_TEMP/sa.json"
