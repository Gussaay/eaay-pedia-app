name: List bank

# Read only: prints the MRCPCH bank's books and quizzes to the log.
on:
  push:
    branches:
      - claude/project-thread-uhn5sv
    paths:
      - 'scripts/list-bank.mjs'
      - '.github/workflows/list-bank.yml'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: List
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/list-bank.mjs --bank mrcpch
          rm -f "$RUNNER_TEMP/sa.json"
