name: Sort exam questions

# Sorts the Gulf Licensing questions into chapters and sciences and writes the
# browse counts (scripts/browse-exam.mjs). MODE in the step: report, dry or commit.
on:
  push:
    branches:
      - claude/project-thread-cop9he
    paths:
      - 'scripts/browse-exam.mjs'
      - '.github/workflows/browse-exam.yml'
  workflow_dispatch:

concurrency:
  group: link-exam
  cancel-in-progress: false

jobs:
  browse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: Sort
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
          MODE: commit
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node --max-old-space-size=6000 scripts/browse-exam.mjs --report
          if [ "$MODE" = commit ]; then
            node --max-old-space-size=6000 scripts/browse-exam.mjs --bank gulf_licensing --commit
          else
            node --max-old-space-size=6000 scripts/browse-exam.mjs --bank gulf_licensing
          fi
          rm -f "$RUNNER_TEMP/sa.json"
