name: Group books

# Writes the book groups in data/groups (e.g. MRCPCH → TAS and FOP) with
# scripts/group-books.mjs. Runs only from this branch. The undo manifest is
# kept as a run artifact (node scripts/group-books.mjs --undo <file> --commit).
on:
  push:
    branches:
      - claude/project-thread-uhn5sv
    paths:
      - 'data/groups/*.json'
      - 'scripts/group-books.mjs'
      - '.github/workflows/group-books.yml'
  workflow_dispatch:

concurrency:
  group: group-books
  cancel-in-progress: false

jobs:
  group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools@14
      - name: Write groups
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/group-books.mjs data/groups/mrcpch.json --commit
          node scripts/list-bank.mjs --bank mrcpch | grep -E '^(# |-P1xU0)'
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-books-undo
          path: .tmp/group-*.json
          if-no-files-found: ignore
          include-hidden-files: true
