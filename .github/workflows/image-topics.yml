name: Image topics report

# Read only: lists the main topics of all questions with their counts, to plan
# explanation images (scripts/image-topics.mjs).
on:
  push:
    branches:
      - claude/project-thread-4sow4l
    paths:
      - 'scripts/image-topics.mjs'
      - '.github/workflows/image-topics.yml'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i -g firebase-tools@14
      - name: Report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EASY_PEDIA }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/image-topics.mjs --min 3
          rm -f "$RUNNER_TEMP/sa.json"
