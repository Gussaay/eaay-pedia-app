<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<rect width="800" height="600" fill="#fff"/>
<text x="30.0" y="42.0" font-size="26" fill="#0D47A1" font-weight="700">Tuberous sclerosis: signs to recognise</text>
<text x="30.0" y="70.0" font-size="16" fill="#455A64">Autosomal dominant (TSC1/TSC2). Seizures + skin signs + tumours.</text>
<rect x="30" y="110" width="740" height="46" rx="10" fill="#FFF5F5"/>
<text x="46.0" y="139.0" font-size="16" fill="#C62828" font-weight="700">Ash-leaf macules</text>
<text x="260.0" y="139.0" font-size="14.5" fill="#263238">pale, leaf-shaped patches (Wood lamp); often the first skin sign</text>
<rect x="30" y="165" width="740" height="46" rx="10" fill="#F1F7FE"/>
<text x="46.0" y="194.0" font-size="16" fill="#0D47A1" font-weight="700">Facial angiofibromas</text>
<text x="260.0" y="194.0" font-size="14.5" fill="#263238">red papules over the nose and cheeks, from about age 3–5</text>
<rect x="30" y="220" width="740" height="46" rx="10" fill="#FFF5F5"/>
<text x="46.0" y="249.0" font-size="16" fill="#C62828" font-weight="700">Shagreen patch</text>
<text x="260.0" y="249.0" font-size="14.5" fill="#263238">thick, orange-peel skin over the lower back</text>
<rect x="30" y="275" width="740" height="46" rx="10" fill="#F1F7FE"/>
<text x="46.0" y="304.0" font-size="16" fill="#0D47A1" font-weight="700">Periungual fibromas</text>
<text x="260.0" y="304.0" font-size="14.5" fill="#263238">nail-fold growths, usually after puberty</text>
<rect x="30" y="330" width="740" height="46" rx="10" fill="#FFF5F5"/>
<text x="46.0" y="359.0" font-size="16" fill="#C62828" font-weight="700">Cardiac rhabdomyomas</text>
<text x="260.0" y="359.0" font-size="14.5" fill="#263238">earliest sign (fetus/newborn); may cause SVT/arrhythmia; most shrink</text>
<rect x="30" y="385" width="740" height="46" rx="10" fill="#F1F7FE"/>
<text x="46.0" y="414.0" font-size="16" fill="#0D47A1" font-weight="700">Brain</text>
<text x="260.0" y="414.0" font-size="14.5" fill="#263238">cortical tubers; SEGA near foramen of Monro → hydrocephalus</text>
<rect x="30" y="440" width="740" height="46" rx="10" fill="#FFF5F5"/>
<text x="46.0" y="469.0" font-size="16" fill="#C62828" font-weight="700">Seizures</text>
<text x="260.0" y="469.0" font-size="14.5" fill="#263238">infantile spasms (treat with vigabatrin), learning difficulty, autism</text>
<rect x="30" y="495" width="740" height="46" rx="10" fill="#F1F7FE"/>
<text x="46.0" y="524.0" font-size="16" fill="#0D47A1" font-weight="700">Kidney</text>
<text x="260.0" y="524.0" font-size="14.5" fill="#263238">angiomyolipomas and cysts</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
<text x="770.0" y="586.0" font-size="15" fill="#E3F2FD" text-anchor="end">easy-pedia.web.app · original illustration</text>
</svg>