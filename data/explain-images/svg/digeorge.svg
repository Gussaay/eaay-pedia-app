<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<rect width="800" height="600" fill="#fff"/>
<text x="30.0" y="42.0" font-size="26" fill="#0D47A1" font-weight="700">22q11 deletion (DiGeorge): CATCH-22</text>
<text x="30.0" y="70.0" font-size="16" fill="#455A64">Microdeletion on chromosome 22q11.2.</text>
<rect x="30" y="105" width="740" height="62" rx="12" fill="#F1F7FE"/>
<circle cx="68" cy="136" r="24" fill="#0D47A1"/>
<text x="68.0" y="143.0" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">C</text>
<text x="106.0" y="132.0" font-size="16.5" fill="#0D47A1" font-weight="700">Cardiac</text>
<text x="106.0" y="154.0" font-size="14.5" fill="#263238">conotruncal defects: truncus arteriosus, interrupted aortic arch, tetralogy of Fallot, VSD</text>
<rect x="30" y="177" width="740" height="62" rx="12" fill="#F1F7FE"/>
<circle cx="68" cy="208" r="24" fill="#0D47A1"/>
<text x="68.0" y="215.0" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">A</text>
<text x="106.0" y="204.0" font-size="16.5" fill="#0D47A1" font-weight="700">Abnormal face</text>
<text x="106.0" y="226.0" font-size="14.5" fill="#263238">long face, hooded eyes, small mouth, small low-set ears</text>
<rect x="30" y="249" width="740" height="62" rx="12" fill="#F1F7FE"/>
<circle cx="68" cy="280" r="24" fill="#0D47A1"/>
<text x="68.0" y="287.0" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">T</text>
<text x="106.0" y="276.0" font-size="16.5" fill="#0D47A1" font-weight="700">Thymic hypoplasia</text>
<text x="106.0" y="298.0" font-size="14.5" fill="#263238">T-cell deficiency → recurrent infections, candidiasis; irradiate blood products</text>
<rect x="30" y="321" width="740" height="62" rx="12" fill="#F1F7FE"/>
<circle cx="68" cy="352" r="24" fill="#0D47A1"/>
<text x="68.0" y="359.0" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">C</text>
<text x="106.0" y="348.0" font-size="16.5" fill="#0D47A1" font-weight="700">Cleft palate</text>
<text x="106.0" y="370.0" font-size="14.5" fill="#263238">or velopharyngeal insufficiency (nasal speech), feeding problems</text>
<rect x="30" y="393" width="740" height="62" rx="12" fill="#F1F7FE"/>
<circle cx="68" cy="424" r="24" fill="#0D47A1"/>
<text x="68.0" y="431.0" font-size="19" fill="#fff" font-weight="700" text-anchor="middle">H</text>
<text x="106.0" y="420.0" font-size="16.5" fill="#0D47A1" font-weight="700">Hypocalcaemia</text>
<text x="106.0" y="442.0" font-size="14.5" fill="#263238">hypoparathyroidism → neonatal seizures, tetany</text>
<rect x="30" y="465" width="740" height="62" rx="12" fill="#F1F7FE"/>
<circle cx="68" cy="496" r="24" fill="#0D47A1"/>
<text x="68.0" y="503.0" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">22</text>
<text x="106.0" y="492.0" font-size="16.5" fill="#0D47A1" font-weight="700">Chromosome 22</text>
<text x="106.0" y="514.0" font-size="14.5" fill="#263238">diagnose by microarray (or FISH); also renal anomalies, learning and psychiatric problems</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
<text x="770.0" y="586.0" font-size="15" fill="#E3F2FD" text-anchor="end">easy-pedia.web.app · original illustration</text>
</svg>