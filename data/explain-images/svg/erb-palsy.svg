<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <rect width="800" height="600" fill="#fff"/>
  <text x="30" y="42" font-size="26" font-weight="700" fill="#0D47A1">Erb palsy: the "waiter's tip" posture</text>
  <text x="30" y="70" font-size="16" fill="#455A64">Upper brachial plexus injury (C5, C6), often after shoulder dystocia or breech delivery.</text>

  <!-- baby torso, front view; right arm affected (viewer's left) -->
  <g transform="translate(40,95)">
    <circle cx="200" cy="55" r="45" fill="#F7E1CF" stroke="#C9A58A" stroke-width="2"/>
    <path d="M140 110 Q200 95 260 110 L268 250 Q200 268 132 250 Z" fill="#F7E1CF" stroke="#C9A58A" stroke-width="2"/>
    <!-- normal left arm (viewer's right): flexed, hand up -->
    <path d="M260 118 Q300 150 300 200 Q298 230 275 250" fill="none" stroke="#C9A58A" stroke-width="26" stroke-linecap="round"/>
    <path d="M260 118 Q300 150 300 200 Q298 230 275 250" fill="none" stroke="#F7E1CF" stroke-width="22" stroke-linecap="round"/>
    <circle cx="272" cy="256" r="14" fill="#F7E1CF" stroke="#C9A58A" stroke-width="2"/>
    <text x="290" y="290" font-size="13" fill="#78909C">normal arm</text>
    <!-- affected right arm: hangs by side, extended, internally rotated, pronated, wrist flexed -->
    <path d="M140 118 Q118 180 116 260 L116 330" fill="none" stroke="#C9A58A" stroke-width="26" stroke-linecap="round"/>
    <path d="M140 118 Q118 180 116 260 L116 330" fill="none" stroke="#F7E1CF" stroke-width="22" stroke-linecap="round"/>
    <!-- flexed wrist with fingers pointing backwards -->
    <path d="M116 332 Q112 352 96 360 L80 360" fill="none" stroke="#C9A58A" stroke-width="18" stroke-linecap="round"/>
    <path d="M116 332 Q112 352 96 360 L80 360" fill="none" stroke="#F7E1CF" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- labels for posture -->
  <g font-size="15" fill="#263238">
    <line x1="175" y1="225" x2="40" y2="160" stroke="#D32F2F" stroke-width="1.5"/>
    <text x="30" y="125" font-weight="700" fill="#C62828">Shoulder</text>
    <text x="30" y="145">adducted, internally rotated</text>
    <line x1="156" y1="350" x2="40" y2="300" stroke="#D32F2F" stroke-width="1.5"/>
    <text x="30" y="270" font-weight="700" fill="#C62828">Elbow</text>
    <text x="30" y="290">extended</text>
    <line x1="100" y1="462" x2="70" y2="476" stroke="#D32F2F" stroke-width="1.5"/>
    <text x="30" y="492" font-weight="700" fill="#C62828">Forearm pronated,</text>
    <text x="30" y="512" font-weight="700" fill="#C62828">wrist flexed, palm turned back</text>
    <text x="30" y="538" fill="#455A64">Grasp reflex present, Moro absent on that side</text>
  </g>

  <!-- brachial plexus roots -->
  <g transform="translate(470,110)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#263238">Roots of the brachial plexus</text>
    <g font-size="16">
      <rect x="0" y="20" width="80" height="40" rx="8" fill="#D32F2F"/><text x="40" y="46" text-anchor="middle" fill="#fff" font-weight="700">C5</text>
      <rect x="0" y="70" width="80" height="40" rx="8" fill="#D32F2F"/><text x="40" y="96" text-anchor="middle" fill="#fff" font-weight="700">C6</text>
      <rect x="0" y="120" width="80" height="40" rx="8" fill="#FFCDD2"/><text x="40" y="146" text-anchor="middle" fill="#B71C1C">C7</text>
      <rect x="0" y="170" width="80" height="40" rx="8" fill="#ECEFF1"/><text x="40" y="196" text-anchor="middle" fill="#455A64">C8</text>
      <rect x="0" y="220" width="80" height="40" rx="8" fill="#ECEFF1"/><text x="40" y="246" text-anchor="middle" fill="#455A64">T1</text>
    </g>
    <path d="M92 22 L102 22 L102 108 L92 108" fill="none" stroke="#D32F2F" stroke-width="2.5"/>
    <text x="112" y="58" font-size="16" font-weight="700" fill="#C62828">Erb palsy</text>
    <text x="112" y="80" font-size="14" fill="#263238">C5–C6 (± C7)</text>
    <path d="M92 172 L102 172 L102 258 L92 258" fill="none" stroke="#78909C" stroke-width="2.5"/>
    <text x="112" y="208" font-size="16" font-weight="700" fill="#455A64">Klumpke palsy</text>
    <text x="112" y="230" font-size="14" fill="#263238">C8–T1: claw hand,</text>
    <text x="112" y="250" font-size="14" fill="#263238">± Horner syndrome</text>
  </g>
  <rect x="470" y="400" width="300" height="130" rx="12" fill="#E3F2FD"/>
  <text x="488" y="428" font-size="16" font-weight="700" fill="#0D47A1">Outlook</text>
  <text x="488" y="452" font-size="15" fill="#263238">• Most recover fully with</text>
  <text x="488" y="472" font-size="15" fill="#263238">   physiotherapy in months</text>
  <text x="488" y="496" font-size="15" fill="#263238">• Look for a fractured clavicle</text>
  <text x="488" y="516" font-size="15" fill="#263238">• No biceps by 3 months: refer</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30" y="586" font-size="16" font-weight="700" fill="#fff">Easy Pedia</text>
<text x="770" y="586" font-size="15" fill="#E3F2FD" text-anchor="end">easy-pedia.web.app · original illustration</text>
</svg>
