<text x="30.0" y="497.9" font-size="15" fill="#C62828" font-weight="700">Narrow QRS, fixed R–R, rate usually 220–300/min in infants</text>
<rect x="540" y="110" width="230" height="400" rx="12" fill="#FFF5F5"/>
<text x="556.0" y="140.0" font-size="16" fill="#C62828" font-weight="700">Treatment</text>
<text x="556.0" y="164.0" font-size="16" fill="#C62828" font-weight="700">Stable</text>
<text x="556.0" y="186.0" font-size="14.5" fill="#263238">1. Vagal manoeuvres</text>
<text x="556.0" y="208.0" font-size="14.5" fill="#263238">   (ice to face in infants,</text>
<text x="556.0" y="230.0" font-size="14.5" fill="#263238">   Valsalva in children)</text>
<text x="556.0" y="252.0" font-size="14.5" fill="#263238">2. IV adenosine by rapid</text>
<text x="556.0" y="274.0" font-size="14.5" fill="#263238">   push with a flush,</text>
<text x="556.0" y="296.0" font-size="14.5" fill="#263238">   then increase the dose</text>
<text x="556.0" y="318.0" font-size="14.5" fill="#263238"></text>
<text x="556.0" y="340.0" font-size="16" fill="#C62828" font-weight="700">Unstable (shock)</text>
<text x="556.0" y="362.0" font-size="14.5" fill="#263238">Synchronised</text>
<text x="556.0" y="384.0" font-size="14.5" fill="#263238">cardioversion 1 J/kg,</text>
<text x="556.0" y="406.0" font-size="14.5" fill="#263238">then 2 J/kg</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
