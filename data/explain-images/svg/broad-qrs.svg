<path d="M36 427.92 Q49.5 409.9 63.0 427.9 L81.0 427.9 L88.2 433.9 L105.0 361.9 L119.4 463.9 L129.0 427.9 L162.0 427.9 Q184.5 445.9 207.0 427.9 L270.0 427.92 Q283.5 409.9 297.0 427.9 L315.0 427.9 L322.2 433.9 L339.0 361.9 L353.4 463.9 L363.0 427.9 L396.0 427.9 Q418.5 445.9 441.0 427.9 L504.0 427.92" fill="none" stroke="#C62828" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" />
<rect x="540" y="110" width="230" height="400" rx="12" fill="#FFF5F5"/>
<text x="556.0" y="140.0" font-size="16" fill="#C62828" font-weight="700">What to know</text>
<text x="556.0" y="164.0" font-size="14.5" fill="#263238">QRS over 100 ms predicts</text>
<text x="556.0" y="186.0" font-size="14.5" fill="#263238">seizures; over 160 ms</text>
<text x="556.0" y="208.0" font-size="14.5" fill="#263238">predicts arrhythmia.</text>
<text x="556.0" y="230.0" font-size="14.5" fill="#263238">Also: tall R in aVR,</text>
<text x="556.0" y="252.0" font-size="14.5" fill="#263238">sinus tachycardia.</text>
<text x="556.0" y="274.0" font-size="14.5" fill="#263238"></text>
<text x="556.0" y="296.0" font-size="16" fill="#C62828" font-weight="700">Treatment</text>
<text x="556.0" y="318.0" font-size="14.5" fill="#263238">IV sodium bicarbonate</text>
<text x="556.0" y="340.0" font-size="14.5" fill="#263238">1–2 mmol/kg: narrows</text>
<text x="556.0" y="362.0" font-size="14.5" fill="#263238">the QRS and prevents</text>
<text x="556.0" y="384.0" font-size="14.5" fill="#263238">arrhythmia. Target</text>
<text x="556.0" y="406.0" font-size="14.5" fill="#263238">blood pH 7.45–7.55.</text>
