<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<rect width="800" height="600" fill="#fff"/>
<text x="30.0" y="42.0" font-size="26" fill="#0D47A1" font-weight="700">Atrioventricular septal defect (AVSD)</text>
<text x="30.0" y="70.0" font-size="16" fill="#455A64">Hole in the centre of the heart, with one common AV valve.</text>
<path d="M275 360 L275 170 Q275 130 330 130 Q390 130 390 190" fill="none" stroke="#E57373" stroke-width="26" stroke-opacity="0.75"/>
<text x="412.0" y="180.0" font-size="15" fill="#B71C1C" font-weight="700">Aorta</text>
<path d="M215 360 L215 180 Q215 150 170 150 L100 150" fill="none" stroke="#5C8DD6" stroke-width="26" stroke-opacity="0.75"/>
<text x="60.0" y="122.0" font-size="15" fill="#0D47A1" font-weight="700">Pulmonary artery</text>
<rect x="60" y="220" width="120" height="110" rx="24" fill="#5C8DD6" fill-opacity="0.3" stroke="#8D6E63" stroke-width="5"/>
<text x="120.0" y="282.0" font-size="20" fill="#263238" font-weight="700" text-anchor="middle">RA</text>
<rect x="60" y="345" width="185" height="150" rx="24" fill="#5C8DD6" fill-opacity="0.3" stroke="#8D6E63" stroke-width="5"/>
<text x="152.5" y="427.0" font-size="20" fill="#263238" font-weight="700" text-anchor="middle">RV</text>
<rect x="320" y="220" width="120" height="110" rx="24" fill="#E57373" fill-opacity="0.3" stroke="#8D6E63" stroke-width="5"/>
<text x="380.0" y="282.0" font-size="20" fill="#263238" font-weight="700" text-anchor="middle">LA</text>
<rect x="255" y="345" width="185" height="150" rx="24" fill="#E57373" fill-opacity="0.3" stroke="#8D6E63" stroke-width="5"/>
<text x="347.5" y="427.0" font-size="20" fill="#263238" font-weight="700" text-anchor="middle">LV</text>
<rect x="180" y="300" width="140" height="50" fill="#fff" stroke="#C62828" stroke-width="3" stroke-dasharray="5 3"/>
<rect x="236" y="345" width="28" height="55" fill="#fff" stroke="#C62828" stroke-width="3" stroke-dasharray="5 3"/>
<path d="M185 335 Q250 352 315 335" fill="none" stroke="#6D4C41" stroke-width="5"/>
<text x="250.0" y="322.0" font-size="13" fill="#6D4C41" font-weight="700" text-anchor="middle">common AV valve</text>
<text x="60.0" y="530.0" font-size="15" fill="#C62828" font-weight="700">Primum ASD (partial AVSD): low atrial hole + cleft mitral valve → mitral regurgitation.</text>
<rect x="500" y="110" width="275" height="400" rx="12" fill="#FFF5F5"/>
<text x="516.0" y="140.0" font-size="16" fill="#C62828" font-weight="700">Key facts</text>
<text x="516.0" y="164.0" font-size="14.5" fill="#263238">• The typical heart defect</text>
<text x="516.0" y="186.0" font-size="14.5" fill="#263238">  of Down syndrome</text>
<text x="516.0" y="208.0" font-size="14.5" fill="#263238">  (about 40% of babies with</text>
<text x="516.0" y="230.0" font-size="14.5" fill="#263238">  Down syndrome have CHD)</text>
<text x="516.0" y="252.0" font-size="14.5" fill="#263238">• Every baby with Down</text>
<text x="516.0" y="274.0" font-size="14.5" fill="#263238">  syndrome needs an echo</text>
<text x="516.0" y="296.0" font-size="14.5" fill="#263238">• ECG: superior (left)</text>
<text x="516.0" y="318.0" font-size="14.5" fill="#263238">  axis deviation</text>
<text x="516.0" y="340.0" font-size="14.5" fill="#263238">• Complete AVSD: heart</text>
<text x="516.0" y="362.0" font-size="14.5" fill="#263238">  failure in infancy; repair</text>
<text x="516.0" y="384.0" font-size="14.5" fill="#263238">  at 3–6 months</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
<text x="770.0" y="586.0" font-size="15" fill="#E3F2FD" text-anchor="end">easy-pedia.web.app · original illustration</text>
</svg>