<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<rect width="800" height="600" fill="#fff"/>
<text x="30.0" y="42.0" font-size="26" fill="#0D47A1" font-weight="700">Retinopathy of prematurity (ROP): zones and stages</text>
<text x="30.0" y="70.0" font-size="16" fill="#455A64">Right eye retina, flattened. Vessels grow out from the optic disc.</text>
<circle cx="210" cy="330" r="195" fill="#FFF8E1" stroke="#FFB300" stroke-width="1.5"/>
<circle cx="210" cy="330" r="150" fill="#FFECB3" stroke="#FFB300" stroke-width="1.5"/>
<circle cx="210" cy="330" r="70" fill="#FFE082" stroke="#FFB300" stroke-width="1.5"/>
<circle cx="210" cy="330" r="14" fill="#FFCC80" stroke="#E65100" stroke-width="2"/>
<text x="210.0" y="364.0" font-size="12.5" fill="#E65100" font-weight="600" text-anchor="middle">disc</text>
<text x="210.0" y="290.0" font-size="14" fill="#263238" font-weight="700" text-anchor="middle">Zone I</text>
<text x="210.0" y="230.0" font-size="14" fill="#263238" font-weight="700" text-anchor="middle">Zone II</text>
<text x="210.0" y="165.0" font-size="14" fill="#263238" font-weight="700" text-anchor="middle">Zone III</text>
