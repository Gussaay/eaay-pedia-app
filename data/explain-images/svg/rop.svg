<path d="M210 330 Q169.85216361846852 374.58868952864367 148 438" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M210 330 Q150.5839158755058 338.35038605760394 93 373" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M210 330 Q159.11711423061445 298.2048441460077 93 287" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M210 330 Q191.45898033750314 272.9366090222908 147 222" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M210 330 Q232.47639560495472 274.3689687259928 232 207" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M210 330 Q262.9768555715356 301.83170623284656 306 250" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect x="440" y="110" width="70" height="62" rx="8" fill="#FFF8E1" stroke="#FFB300"/>
<path d="M446 141 L470 141" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="476.0" y1="118.0" x2="476.0" y2="164.0" stroke="#ECEFF1" stroke-width="4" />
<text x="524.0" y="136.0" font-size="15" fill="#263238" font-weight="700">Stage 1: Demarcation line</text>
<text x="524.0" y="156.0" font-size="13" fill="#455A64">flat white line at the edge of the vessels</text>
<rect x="440" y="190" width="70" height="62" rx="8" fill="#FFF8E1" stroke="#FFB300"/>
<path d="M446 221 L470 221" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect x="472" y="198" width="9" height="46" rx="4" fill="#F48FB1"/>
<text x="524.0" y="216.0" font-size="15" fill="#263238" font-weight="700">Stage 2: Ridge</text>
<text x="524.0" y="236.0" font-size="13" fill="#455A64">the line has height and width</text>
<rect x="440" y="270" width="70" height="62" rx="8" fill="#FFF8E1" stroke="#FFB300"/>
<path d="M446 301 L470 301" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<rect x="472" y="278" width="9" height="46" rx="4" fill="#F48FB1"/>
<path d="M481 290 l10 -6 M481 301 l12 0 M481 312 l10 6" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text x="524.0" y="296.0" font-size="15" fill="#263238" font-weight="700">Stage 3: Extraretinal fibrovascular</text>
<text x="524.0" y="316.0" font-size="13" fill="#455A64">new vessels grow off the ridge</text>
<rect x="440" y="350" width="70" height="62" rx="8" fill="#FFF8E1" stroke="#FFB300"/>
<path d="M446 381 L470 381" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M478 360 Q498 381 478 402" fill="none" stroke="#6D4C41" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="524.0" y="376.0" font-size="15" fill="#263238" font-weight="700">Stage 4: Partial retinal detachment</text>
<text x="524.0" y="396.0" font-size="13" fill="#455A64">4A spares the macula, 4B involves it</text>
<rect x="440" y="430" width="70" height="62" rx="8" fill="#FFF8E1" stroke="#FFB300"/>
<path d="M446 461 L470 461" fill="none" stroke="#D32F2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M460 438 Q504 461 460 484" fill="none" stroke="#6D4C41" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="524.0" y="456.0" font-size="15" fill="#263238" font-weight="700">Stage 5: Total retinal detachment</text>
<text x="524.0" y="476.0" font-size="13" fill="#455A64"></text>
<text x="440.0" y="520.0" font-size="14" fill="#C62828" font-weight="700">Plus disease = dilated, twisty vessels at the disc.</text>
<text x="440.0" y="540.0" font-size="14" fill="#C62828" font-weight="700">Treat type 1 ROP (laser or anti-VEGF).</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
