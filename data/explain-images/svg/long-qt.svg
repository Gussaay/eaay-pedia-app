<text x="84.0" y="471.9" font-size="15" fill="#C62828" font-weight="700">QT 540 ms: long, broad T wave</text>
<rect x="540" y="110" width="230" height="400" rx="12" fill="#FFF5F5"/>
<text x="556.0" y="140.0" font-size="16" fill="#C62828" font-weight="700">What to know</text>
<text x="556.0" y="164.0" font-size="14.5" fill="#263238">QTc above about 460 ms</text>
<text x="556.0" y="186.0" font-size="14.5" fill="#263238">is long. Risk: torsades</text>
<text x="556.0" y="208.0" font-size="14.5" fill="#263238">de pointes, syncope with</text>
<text x="556.0" y="230.0" font-size="14.5" fill="#263238">exercise, sudden death.</text>
<text x="556.0" y="252.0" font-size="14.5" fill="#263238"></text>
<text x="556.0" y="274.0" font-size="16" fill="#C62828" font-weight="700">Causes</text>
<text x="556.0" y="296.0" font-size="14.5" fill="#263238">• Congenital: Romano–Ward;</text>
<text x="556.0" y="318.0" font-size="14.5" fill="#263238">  Jervell and Lange-Nielsen</text>
<text x="556.0" y="340.0" font-size="14.5" fill="#263238">  (with deafness)</text>
<text x="556.0" y="362.0" font-size="14.5" fill="#263238">• Drugs: macrolides</text>
<text x="556.0" y="384.0" font-size="14.5" fill="#263238">  (erythromycin), others</text>
<text x="556.0" y="406.0" font-size="14.5" fill="#263238">• Low K, Mg or Ca;</text>
<text x="556.0" y="428.0" font-size="14.5" fill="#263238">  anorexia nervosa</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
