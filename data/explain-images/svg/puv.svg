<text x="514.0" y="505.0" font-size="14" fill="#C62828" font-weight="700">valves</text>
<rect x="570" y="110" width="205" height="430" rx="12" fill="#FFF5F5"/>
<text x="586.0" y="140.0" font-size="16" fill="#C62828" font-weight="700">Findings</text>
<text x="586.0" y="164.0" font-size="14.5" fill="#263238">• Both kidneys and</text>
<text x="586.0" y="186.0" font-size="14.5" fill="#263238">  ureters dilated</text>
<text x="586.0" y="208.0" font-size="14.5" fill="#263238">  (hydronephrosis)</text>
<text x="586.0" y="230.0" font-size="14.5" fill="#263238">• Thick-walled,</text>
<text x="586.0" y="252.0" font-size="14.5" fill="#263238">  trabeculated bladder</text>
<text x="586.0" y="274.0" font-size="14.5" fill="#263238">• Antenatal: bilateral</text>
<text x="586.0" y="296.0" font-size="14.5" fill="#263238">  hydronephrosis,</text>
<text x="586.0" y="318.0" font-size="14.5" fill="#263238">  oligohydramnios</text>
<text x="586.0" y="340.0" font-size="14.5" fill="#263238"></text>
<text x="586.0" y="362.0" font-size="16" fill="#C62828" font-weight="700">Diagnosis</text>
<text x="586.0" y="384.0" font-size="14.5" fill="#263238">Ultrasound, then</text>
<text x="586.0" y="406.0" font-size="14.5" fill="#263238">MCUG (micturating</text>
<text x="586.0" y="428.0" font-size="14.5" fill="#263238">cystourethrogram)</text>
<text x="586.0" y="450.0" font-size="14.5" fill="#263238">confirms the valves</text>
