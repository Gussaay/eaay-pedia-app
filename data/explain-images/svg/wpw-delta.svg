<text x="217.0" y="379.0" font-size="15" fill="#C62828" font-weight="700">delta wave (slurred upstroke)</text>
<text x="217.0" y="400.0" font-size="15" fill="#263238">wide QRS</text>
<rect x="540" y="120" width="230" height="365" rx="12" fill="#FFF5F5"/>
<text x="556" y="150" font-size="16" font-weight="700" fill="#C62828">Why it happens</text>
<text x="556" y="172" font-size="14.5" fill="#263238">An accessory pathway</text>
<text x="556" y="194" font-size="14.5" fill="#263238">(bundle of Kent) lets the</text>
<text x="556" y="216" font-size="14.5" fill="#263238">impulse skip the AV node</text>
<text x="556" y="238" font-size="14.5" fill="#263238">and excite the ventricles</text>
<text x="556" y="260" font-size="14.5" fill="#263238">early.</text>
<text x="556" y="282" font-size="14.5" fill="#263238"></text>
<text x="556" y="304" font-size="16" font-weight="700" fill="#C62828">Exam links</text>
<text x="556" y="326" font-size="14.5" fill="#263238">• Causes SVT (AVRT)</text>
<text x="556" y="348" font-size="14.5" fill="#263238">• Stable SVT: vagal</text>
<text x="556" y="370" font-size="14.5" fill="#263238">   manoeuvres, then adenosine</text>
<text x="556" y="392" font-size="14.5" fill="#263238">• Associated with Ebstein</text>
<text x="556" y="414" font-size="14.5" fill="#263238">   anomaly</text>
<text x="556" y="436" font-size="14.5" fill="#263238">• Avoid AV-node blockers</text>
<text x="556" y="458" font-size="14.5" fill="#263238">   in pre-excited AF</text>
