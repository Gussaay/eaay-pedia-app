<text x="30.0" y="294.0" font-size="15" fill="#263238">Regular P waves (about 125/min) and slow regular QRS (about 55/min) with no link between them.</text>
<rect x="30" y="345" width="740" height="170" rx="12" fill="#FFF5F5"/>
<text x="46.0" y="375.0" font-size="16" fill="#C62828" font-weight="700">Neonatal lupus (maternal anti-Ro / anti-La antibodies)</text>
<text x="46.0" y="399.0" font-size="14.5" fill="#263238">• The antibodies cross the placenta from about 16 weeks and scar the AV node: the block is permanent.</text>
<text x="46.0" y="421.0" font-size="14.5" fill="#263238">• Other features: annular rash (often after sun), low platelets, raised liver enzymes (these settle).</text>
<text x="46.0" y="443.0" font-size="14.5" fill="#263238">• Many babies need a pacemaker; the risk is higher in the next pregnancy.</text>
<text x="46.0" y="465.0" font-size="14.5" fill="#263238">• Screen fetal heart rate in mothers with SLE or Sjögren who carry anti-Ro.</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
