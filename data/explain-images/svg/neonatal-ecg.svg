<path d="M296 230 L310 230 Q322 216 334 230 L354 230 L360 205 L368 310 L374 230 L400 230 Q420 208 440 230 L504 230" fill="none" stroke="#263238" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" />
<text x="30.0" y="340.0" font-size="15" fill="#0D47A1" font-weight="700">Dominant R wave in V1</text>
<text x="30.0" y="362.0" font-size="15" fill="#0D47A1" font-weight="700">Right axis up to +180°</text>
<text x="30.0" y="384.0" font-size="15" fill="#0D47A1" font-weight="700">T wave in V1 inverted</text>
<text x="30.0" y="406.0" font-size="15" fill="#0D47A1" font-weight="700">after the first week</text>
<text x="290.0" y="340.0" font-size="15" fill="#263238" font-weight="700">Dominant S wave in V1</text>
<text x="290.0" y="362.0" font-size="15" fill="#263238" font-weight="700">Axis about +60°</text>
<text x="290.0" y="384.0" font-size="15" fill="#263238" font-weight="700">T in V1 often upright</text>
<text x="290.0" y="406.0" font-size="15" fill="#263238" font-weight="700">(inverted through childhood)</text>
<rect x="540" y="120" width="230" height="400" rx="12" fill="#F1F7FE"/>
<text x="556.0" y="150.0" font-size="16" fill="#0D47A1" font-weight="700">Why</text>
<text x="556.0" y="174.0" font-size="14.5" fill="#263238">Before birth the right</text>
<text x="556.0" y="196.0" font-size="14.5" fill="#263238">ventricle pumps against</text>
<text x="556.0" y="218.0" font-size="14.5" fill="#263238">high lung resistance, so</text>
<text x="556.0" y="240.0" font-size="14.5" fill="#263238">it is thicker at birth.</text>
<text x="556.0" y="262.0" font-size="14.5" fill="#263238"></text>
<text x="556.0" y="284.0" font-size="14.5" fill="#263238">The pattern changes</text>
<text x="556.0" y="306.0" font-size="14.5" fill="#263238">over the first months</text>
<text x="556.0" y="328.0" font-size="14.5" fill="#263238">as the left ventricle</text>
<text x="556.0" y="350.0" font-size="14.5" fill="#263238">takes over.</text>
<text x="556.0" y="372.0" font-size="14.5" fill="#263238"></text>
<text x="556.0" y="394.0" font-size="16" fill="#0D47A1" font-weight="700">Abnormal in a newborn</text>
<text x="556.0" y="416.0" font-size="14.5" fill="#263238">• Left axis deviation</text>
<text x="556.0" y="438.0" font-size="14.5" fill="#263238">  (think AVSD,</text>
<text x="556.0" y="460.0" font-size="14.5" fill="#263238">  tricuspid atresia)</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
