<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<rect width="800" height="600" fill="#fff"/>
<text x="30.0" y="42.0" font-size="26" fill="#0D47A1" font-weight="700">Salter–Harris fractures (growth plate)</text>
<text x="30.0" y="70.0" font-size="16" fill="#455A64">Remember SALTR. Blue = growth plate (physis); red = fracture line.</text>
<path d="M50 180 Q50 120 100 120 Q150 120 150 180 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<rect x="50" y="180" width="100" height="12" fill="#4FC3F7"/>
<path d="M50 192 L150 192 L135 260 L130 360 L70 360 L65 260 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<path d="M44 186 L156 186" fill="none" stroke="#C62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="100.0" y="412.0" font-size="20" fill="#0D47A1" font-weight="700" text-anchor="middle">Type I</text>
<text x="100.0" y="442.0" font-size="15" fill="#263238" font-weight="700" text-anchor="middle">Straight across</text>
<text x="100.0" y="464.0" font-size="13.5" fill="#455A64" text-anchor="middle">Through the physis</text>
<text x="100.0" y="482.0" font-size="13.5" fill="#455A64" text-anchor="middle">only</text>
<path d="M200 180 Q200 120 250 120 Q300 120 300 180 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<rect x="200" y="180" width="100" height="12" fill="#4FC3F7"/>
<path d="M200 192 L300 192 L285 260 L280 360 L220 360 L215 260 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<path d="M194 186 L260 186 L292 240" fill="none" stroke="#C62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="250.0" y="412.0" font-size="20" fill="#0D47A1" font-weight="700" text-anchor="middle">Type II</text>
<text x="250.0" y="442.0" font-size="15" fill="#263238" font-weight="700" text-anchor="middle">Above</text>
<text x="250.0" y="464.0" font-size="13.5" fill="#455A64" text-anchor="middle">Physis + metaphysis</text>
<text x="250.0" y="482.0" font-size="13.5" fill="#455A64" text-anchor="middle">(commonest)</text>
<path d="M350 180 Q350 120 400 120 Q450 120 450 180 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<rect x="350" y="180" width="100" height="12" fill="#4FC3F7"/>
<path d="M350 192 L450 192 L435 260 L430 360 L370 360 L365 260 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<path d="M344 186 L410 186 L400 118" fill="none" stroke="#C62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="400.0" y="412.0" font-size="20" fill="#0D47A1" font-weight="700" text-anchor="middle">Type III</text>
<text x="400.0" y="442.0" font-size="15" fill="#263238" font-weight="700" text-anchor="middle">Lower</text>
<text x="400.0" y="464.0" font-size="13.5" fill="#455A64" text-anchor="middle">Physis + epiphysis</text>
<text x="400.0" y="482.0" font-size="13.5" fill="#455A64" text-anchor="middle">(into joint)</text>
<path d="M500 180 Q500 120 550 120 Q600 120 600 180 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<rect x="500" y="180" width="100" height="12" fill="#4FC3F7"/>
<path d="M500 192 L600 192 L585 260 L580 360 L520 360 L515 260 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<path d="M546 118 L558 186 L585 245" fill="none" stroke="#C62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="550.0" y="412.0" font-size="20" fill="#0D47A1" font-weight="700" text-anchor="middle">Type IV</text>
<text x="550.0" y="442.0" font-size="15" fill="#263238" font-weight="700" text-anchor="middle">Through</text>
<text x="550.0" y="464.0" font-size="13.5" fill="#455A64" text-anchor="middle">Metaphysis + physis</text>
<text x="550.0" y="482.0" font-size="13.5" fill="#455A64" text-anchor="middle">+ epiphysis</text>
<path d="M650 180 Q650 120 700 120 Q750 120 750 180 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<rect x="650" y="180" width="100" height="12" fill="#4FC3F7"/>
<path d="M650 192 L750 192 L735 260 L730 360 L670 360 L665 260 Z" fill="#F3E5C8" stroke="#8D6E63" stroke-width="2"/>
<rect x="650" y="180" width="100" height="12" fill="#C62828"/>
<line x1="700.0" y1="98.0" x2="700.0" y2="116.0" stroke="#C62828" stroke-width="3" />
<path d="M696.5 107.7 L700.0 116.0 L703.5 107.7 Z" fill="#C62828"/>
<line x1="700.0" y1="384.0" x2="700.0" y2="366.0" stroke="#C62828" stroke-width="3" />
<path d="M703.5 374.3 L700.0 366.0 L696.5 374.3 Z" fill="#C62828"/>
<text x="700.0" y="412.0" font-size="20" fill="#0D47A1" font-weight="700" text-anchor="middle">Type V</text>
<text x="700.0" y="442.0" font-size="15" fill="#263238" font-weight="700" text-anchor="middle">Rammed</text>
<text x="700.0" y="464.0" font-size="13.5" fill="#455A64" text-anchor="middle">Crush of the</text>
<text x="700.0" y="482.0" font-size="13.5" fill="#455A64" text-anchor="middle">physis</text>
<text x="30.0" y="506.0" font-size="14" fill="#263238">Higher type = worse outlook. I and II usually heal in a cast; III and IV enter the joint and often need fixation;</text>
<text x="30.0" y="526.0" font-size="14" fill="#263238">V is often missed and may stop growth. In a toddler, an unexplained fracture needs a safeguarding assessment.</text>
<rect x="0" y="560" width="800" height="40" fill="#1976D2"/>
<text x="30.0" y="586.0" font-size="16" fill="#fff" font-weight="700">Easy Pedia</text>
<text x="770.0" y="586.0" font-size="15" fill="#E3F2FD" text-anchor="end">easy-pedia.web.app · original illustration</text>
</svg>