<text x="200.0" y="470.0" font-size="15" fill="#C62828" font-weight="700" text-anchor="middle">Whole half of the face is weak,</text>
<text x="200.0" y="490.0" font-size="15" fill="#C62828" font-weight="700" text-anchor="middle">including the forehead.</text>
<text x="200.0" y="510.0" font-size="15" fill="#C62828" font-weight="700" text-anchor="middle">Eye cannot close.</text>
<text x="600.0" y="470.0" font-size="15" fill="#0D47A1" font-weight="700" text-anchor="middle">Lower face weak; forehead spared</text>
<text x="600.0" y="490.0" font-size="15" fill="#0D47A1" font-weight="700" text-anchor="middle">(it gets nerve supply from</text>
<text x="600.0" y="510.0" font-size="15" fill="#0D47A1" font-weight="700" text-anchor="middle">both sides of the brain).</text>
